name: Check

on:
  push:
  pull_request:

# The check only reads the code; keep the token read-only
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check faphouse-cleaner.user.js
      - name: Header has @version
        run: grep -qE '^// @version +[0-9]' faphouse-cleaner.user.js
