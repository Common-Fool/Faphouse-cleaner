name: Bug report
description: A filter or button doesn't work, or something else broke
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Which filter or page is affected?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version
      description: Shown in your userscript manager (e.g. 1.11).
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and userscript manager
      placeholder: Chrome 141, Tampermonkey 5.4
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The listing page where the problem shows up.
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Any errors from the F12 console, if there are some.
      render: text
